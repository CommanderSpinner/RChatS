<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
        }

        footer {
            position: fixed;
            bottom: 0;       
            left: 0;         
            width: 100%;
            text-align: center;
        }

        footer a {
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
    <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <header class="text-white py-3 bg-dark text-center">
        <h1>{{ title }}</h1>
    </header>
    <main class="py-3 container d-flex justify-content-between align-items-center col-3">
        
        {% include "form.html" %}

    </main>
    <footer class="mt-5 p-4 text-center">
        <a href="https://github.com/CommanderSpinner" class="text-primary">made by commander Spinner</a>
    </footer>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
