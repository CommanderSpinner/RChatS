name: rchats_server

on:
  push:

jobs:
  build:
    runs-on: debian

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .                    
          file: ./Dockerfile.server     
          push: false                   
          tags: rchats:latest